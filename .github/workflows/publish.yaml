name: Publish to NPM
on:
  release:
    types: [created]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Node
        uses: actions/setup-node@v2
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies 📦
        run: yarn
      - name: Run linter 👁️
        run: yarn lint
      - name: Run type checking
        run: yarn check
      - name: Run tests 🧪
        run: yarn test
      - name: Build 🔧
        run: yarn build
      - name: Publish package to NPM 📦
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_SECRET }}
